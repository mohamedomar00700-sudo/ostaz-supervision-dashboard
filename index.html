<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>لوحة إشراف - أستاذ أونلاين</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أستاذ أونلاين">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css?v=lead1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ===== الدخول / التسجيل ===== -->
<div id="view-auth" class="authwrap hidden">
  <div class="authcard card">
    <img src="logo.png" class="logo" alt="أستاذ أونلاين">
    <h1 class="t-center">أكاديمية أستاذ أونلاين</h1>
    <p class="sub t-center mb">لوحة تحكم فريق الإشراف</p>

    <div id="auth-error" class="err hidden"></div>

    <div id="auth-fields-name" class="field hidden">
      <label>الاسم</label>
      <input id="auth-name" class="input" placeholder="اسمك بالكامل">
    </div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="auth-email" type="email" class="input" placeholder="name@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="auth-pass" type="password" class="input" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button id="auth-submit" class="btn btn-brand w100" onclick="submitAuth()">دخول</button>

    <div class="or"><span>أو</span></div>

    <button class="btn btn-ghost w100 gbtn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4 5.8l6.6 5.6C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span>الدخول بحساب جوجل</span>
    </button>

    <p class="sub t-center small mt">
      <span id="auth-toggle-text">مفيش حساب؟</span>
      <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-link">سجّل مشرف جديد</a>
    </p>
  </div>
</div>

<!-- ===== انتظار الموافقة ===== -->
<div id="view-pending" class="authwrap hidden">
  <div class="authcard card t-center">
    <img src="logo.png" class="logo" alt="">
    <h1>في انتظار موافقة الأدمن</h1>
    <p class="sub mb">تم إنشاء حسابك بنجاح، لكن محتاج موافقة الأدمن قبل ما تقدر تدخل اللوحة.</p>
    <button class="btn btn-ghost" onclick="checkPendingStatus()">تحقق مرة أخرى</button>
    <button class="btn btn-ghost" onclick="signOut()">تسجيل الخروج</button>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="view-app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" class="logo-sm" alt="">
      <div>
        <div class="b-title">لوحة الإشراف</div>
        <div class="sub small" id="current-user-name"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost icon" onclick="openGlobalSearch()" title="بحث">🔍</button>
      <button class="btn btn-ghost icon" id="btn-alerts" onclick="openAlertsPanel()" title="إشعارات الحصص">🔕</button>
      <button class="btn btn-ghost icon" onclick="openMenu()" title="الإعدادات">⚙️</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="daily" class="tab active" onclick="switchTab('daily')"><span class="ti">📅</span><span class="tl">الجدول</span></button>
    <button data-tab="relay" class="tab" onclick="switchTab('relay')"><span class="ti">🔁</span><span class="tl">الترحيل</span><span class="count hidden" id="relay-count"></span></button>
    <button data-tab="families" class="tab" onclick="switchTab('families')"><span class="ti">👨‍👩‍👧</span><span class="tl">الأسر</span></button>
    <button data-tab="tutors" class="tab" onclick="switchTab('tutors')"><span class="ti">🧑‍🏫</span><span class="tl">المعلمون</span></button>
    <button data-tab="fin" class="tab" onclick="switchTab('fin')"><span class="ti">💰</span><span class="tl">المالية</span></button>
    <button data-tab="reports" class="tab" onclick="switchTab('reports')"><span class="ti">📊</span><span class="tl">الأرقام</span></button>
  </nav>

  <main class="wrap">

    <!-- الجدول اليومي -->
    <section id="view-daily">
      <div id="attention" class="attention hidden"></div>
      <div class="toolbar toolbar-top">
        <div class="seg" id="mode-chips">
          <button class="chip active" data-mode="day" onclick="setDayMode('day')">يوم</button>
          <button class="chip" data-mode="week" onclick="setDayMode('week')">أسبوع</button>
        </div>
        <button class="btn btn-brand" onclick="openSessionForm()">+ حصة جديدة</button>
      </div>
      <div class="daynav mb">
        <button class="btn btn-ghost icon" id="btn-prev" title="اليوم السابق" onclick="shiftDay(-1)">→</button>
        <input type="date" id="day-input" class="input" onchange="setDay(this.value)">
        <button class="btn btn-ghost icon" id="btn-next" title="اليوم التالي" onclick="shiftDay(1)">←</button>
        <button class="btn btn-ghost" onclick="setDay(todayStr())">النهارده</button>
      </div>
      <div id="day-panel">
        <div class="stats" id="day-stats"></div>
        <div class="toolbar" style="margin-bottom:6px"><div class="chips" id="filters" style="margin:0"></div>
          <span class="row-gap"><button class="btn btn-ghost sm" id="btn-reports" onclick="openReports()">📝 التقارير</button>
          <button class="btn btn-ghost sm" onclick="openTutorSchedules()">📋 جداول المعلمين</button></span></div>
        <div id="daily-list" class="list"></div>
      </div>
      <div id="week-panel" class="hidden"></div>
    </section>

    <!-- الترحيل -->
    <section id="view-relay" class="hidden">
      <div class="toolbar">
        <div class="chips" id="relay-filters"></div>
        <button class="btn btn-brand" onclick="openRelayForm()">+ مهمة ترحيل</button>
      </div>
      <div id="relay-list" class="list"></div>
    </section>

    <!-- الأسر -->
    <section id="view-families" class="hidden">
      <div class="chips fin-tabs" id="fam-switch"></div>
      <div id="fam-main">
      <div class="toolbar">
        <input class="input search" id="family-search" placeholder="بحث باسم الأسرة أو الطالب أو الرقم…" oninput="renderFamilies()">
        <button class="btn btn-brand" onclick="openFamilyForm()">+ أسرة جديدة</button>
      </div>
      <div class="sstats" id="families-stats"></div>
      <div class="chips" id="family-chips"></div>
      <div id="families-list" class="list grid2"></div>
      </div>
      <div id="leads-view" class="hidden"></div>
    </section>

    <!-- المعلمون -->
    <section id="view-tutors" class="hidden">
      <div class="toolbar">
        <input class="input search" id="tutor-search" placeholder="بحث باسم المعلم أو المادة…" oninput="renderTutors()">
        <button class="btn btn-brand" onclick="openTutorForm()">+ معلم جديد</button>
      </div>
      <div class="sstats" id="tutors-stats"></div>
      <div class="chips" id="tutor-chips"></div>
      <div id="tutors-list" class="list grid2"></div>
    </section>

    <!-- المالية -->
    <section id="view-fin" class="hidden">
      <div class="toolbar">
        <div class="daynav">
          <select id="fin-period" class="input" onchange="onFinPeriod()">
            <option value="this">الشهر ده</option>
            <option value="last">الشهر اللي فات</option>
            <option value="q">آخر 3 شهور</option>
            <option value="year">السنة دي</option>
            <option value="lastyear">السنة اللي فاتت</option>
            <option value="ayear">السنة الدراسية دي (من سبتمبر)</option>
            <option value="lastayear">السنة الدراسية اللي فاتت</option>
            <option value="all">من أول الأكاديمية</option>
            <option value="custom">من تاريخ لتاريخ</option>
          </select>
          <input type="date" id="fin-from" class="input hidden" onchange="loadFinance()">
          <input type="date" id="fin-to" class="input hidden" onchange="loadFinance()">
        </div>
        <div class="row-gap fin-actions">
          <button class="btn btn-brand" onclick="openPaymentForm()">+ دفعة من أسرة</button>
          <button class="btn btn-ghost sm" onclick="exportSessionsCSV()" title="تنزيل الحصص Excel">⬇️ الحصص</button>
          <button class="btn btn-ghost sm" onclick="exportPaymentsCSV()" title="تنزيل المدفوعات Excel">⬇️ الدفعات</button>
        </div>
      </div>
      <div id="fin-content"></div>
    </section>

    <!-- التقارير -->
    <section id="view-reports" class="hidden">
      <div id="reports-content"></div>
    </section>

    <!-- المشرفون -->
    <section id="view-admin" class="hidden">
      <div id="admin-list" class="list"></div>
    </section>

  </main>
</div>

<!-- ===== بوابة المعلمات ===== -->
<div id="view-tutor" class="hidden">
  <div id="tutor-preview-bar" class="preview-bar hidden">👁 معاينة: ده بالظبط اللي المعلمة بتشوفه من حسابها
    <button class="btn btn-ghost sm" onclick="tutorPreviewExit()">رجوع للوحة الإشراف</button></div>
  <header class="topbar">
    <div class="brand"><img src="logo.png" class="logo-sm" alt="">
      <div><div class="b-title">بوابة المعلمات</div><div class="sub small" id="tutor-name"></div></div></div>
    <div class="top-actions">
      <button class="btn btn-ghost icon" id="t-btn-alerts" onclick="tutorAlertsPanel()" title="التذكير">🔕</button>
      <button class="btn btn-ghost icon" onclick="tutorRefresh()" title="تحديث">↻</button>
      <button class="btn btn-ghost icon" onclick="if(confirm('تسجيل الخروج؟')) signOut().then(()=>document.getElementById('view-tutor').classList.add('hidden'))" title="خروج">خروج</button>
    </div>
  </header>
  <nav class="tabs" id="tutor-tabs">
    <button data-tab="today" class="tab active" onclick="tutorTab('today')"><span class="ti">📅</span><span class="tl">حصصي</span></button>
    <button data-tab="students" class="tab" onclick="tutorTab('students')"><span class="ti">🎒</span><span class="tl">طلابي</span></button>
    <button data-tab="money" class="tab" onclick="tutorTab('money')"><span class="ti">💰</span><span class="tl">حسابي</span></button>
  </nav>
  <main class="wrap"><div id="tutor-content"></div></main>
</div>

<!-- نافذة منبثقة عامة -->
<div id="modal" class="modal hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal-box card">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost icon" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="loading" class="loading hidden">جاري التحميل…</div>

<script src="tutor.js?v=swap1"></script>
<script src="app.js?v=lead1"></script>
</body>
</html>
